name: Fetch memes

on:
  schedule:
    # Refills the /meme pool 4x a day. The Worker posts the daily meme on the first
    # run after 10:00 UTC; repeat calls are no-ops because the DB allows one daily per day.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  actions: write            # keepalive below

concurrency:
  group: fetch-memes

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 meme_bot.py
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      # GitHub disables cron workflows after 60 days without repo activity;
      # re-enabling via the API resets that timer without any commits.
      - if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-meme.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
