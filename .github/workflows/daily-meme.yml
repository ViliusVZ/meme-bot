name: Daily meme

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 12:00/13:00 Lithuania. GitHub cron can run a few minutes late.
  workflow_dispatch:        # manual runs only preview, so they can't double-post
    inputs:
      post:
        description: "Actually post to Discord (only if today's scheduled post failed)"
        type: boolean
        default: false

permissions:
  actions: write            # keepalive below

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 meme_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.post && '1' || '' }}
      # GitHub disables cron workflows after 60 days without repo activity;
      # re-enabling via the API resets that timer without any commits.
      - if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-meme.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
