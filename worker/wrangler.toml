name = "meme-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[triggers]
# keep in sync with CRON_* in src/index.ts
crons = []  # retired: the bot runs on the VPS now (bot/); kept deployable as a fallback

[[d1_databases]]
binding = "DB"
database_name = "meme-bot"
database_id = "19a2aa9d-a88b-4645-aee3-2d7b367021f0"

[vars]
GUILD_ID = "968922621662076988"    # Terrible Trio
CHANNEL_ID = "975506122507178015"  # #daily-memes
SUBREDDIT = "ProgrammerHumor"
POST_HOUR_UTC = "10"
GAME_CHANNEL_ID = "1567132345213911240"  # #game-night
PLAYERS = "306836805825593344,212567787896307713,747902984003780651"  # Vithis, Koral, Lionixity
TIMEZONE = "Europe/Vilnius"
GAME_POLL_HOUR = "17"                    # local time
LOBBY_CHANNEL_ID = "1567166235655802923"  # 🛋️ Lobby: hang out here; game rooms pull people from it
VOICE_CATEGORY_ID = "968922621662076990"  # 🔊 Voice: where game rooms are opened

# run the Worker near its D1 database: interactions make several queries and must answer in 3 s
[placement]
mode = "smart"

[observability]
enabled = true
