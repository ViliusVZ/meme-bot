# Blue/green pair for one deployment of the bot (prod "meme-bot", test bot "meme-bot-dev").
# The deploy script (server repo: host/deploy-app.sh) starts the idle colour with the new image,
# waits for it to be healthy, then stops the other. Caddy sends traffic to whichever is healthy.
x-bot: &bot
  restart: unless-stopped
  init: true
  stop_grace_period: 40s
  env_file: [db.env, config.env, secrets.env]
  environment:
    PORT: "3000"
  networks: [web, db]
  # locked down: nothing to write but /tmp, no Linux capabilities, can't gain privileges, and a leak
  # can't starve Postgres or the other apps (it uses ~50 MB)
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  pids_limit: 256
  # into the server's journal, tagged with the container's name: logs outlive the container, so a
  # deploy doesn't wipe them (read both colours with  ssh vps app-logs <app> [since])
  logging:
    driver: journald
    options: { tag: "{{.Name}}" }

services:
  blue:
    <<: *bot
    image: ${IMAGE_BLUE:-none}
    container_name: ${APP:?}-blue
    environment: { PORT: "3000", APP_NAME: "${APP}-blue" }
  green:
    <<: *bot
    image: ${IMAGE_GREEN:-none}
    container_name: ${APP:?}-green
    environment: { PORT: "3000", APP_NAME: "${APP}-green" }

networks:
  web:
    external: true
  db:
    external: true
